# Pings the Render-hosted Mastra agents service so the free tier does not
# sleep after ~15 minutes of idle traffic (30–60s cold starts).
#
# Schedule: every 10 minutes. GitHub Actions cron can drift a few minutes
# under load — 10 min still keeps you under Render's 15 min idle cutoff.
#
# Override the URL with a repository variable:
#   Settings → Secrets and variables → Actions → Variables
#   Name: MASTRA_KEEPALIVE_URL
#   Value: https://your-service.onrender.com/health

name: Keep Render agents warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping agents health endpoint
        env:
          KEEP_ALIVE_URL: ${{ vars.MASTRA_KEEPALIVE_URL || 'https://sweet-talk-agents.onrender.com/health' }}
        run: |
          set -euo pipefail
          echo "Pinging ${KEEP_ALIVE_URL}"
          # Cold starts can take up to ~60s; allow headroom and retry once.
          for attempt in 1 2; do
            if curl -fsS --max-time 90 --retry 0 -o /tmp/keepalive-body.txt -w "http=%{http_code} time=%{time_total}s\n" "$KEEP_ALIVE_URL"; then
              head -c 200 /tmp/keepalive-body.txt || true
              echo
              exit 0
            fi
            echo "Attempt ${attempt} failed; retrying in 15s…"
            sleep 15
          done
          echo "Keep-alive ping failed after retries"
          exit 1
